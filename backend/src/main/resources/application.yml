spring:
  application:
    name: fitnessfreedom-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fitnessfreedom}
    username: ${DB_USER:fitnessfreedom}
    password: ${DB_PASSWORD:fitnessfreedom}
  mvc:
    problemdetails:
      enabled: true
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    api-key: ${ADMIN_API_KEY:}
